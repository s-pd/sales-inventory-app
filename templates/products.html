{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>📦 All Products</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for p in products %}
            <tr>
                <td>{{ p.product_id }}</td>
                <td>{{ p.product_name }}</td>
                <td>{{ p.category_name or 'N/A' }}</td>
                <td>£{{ p.price }}</td>
                <td>{{ p.stock_quantity }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
